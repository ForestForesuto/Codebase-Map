[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-gitmap"
version = "0.1.1"
description = "A CLI tool that visualizes the file structure of any codebase."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "ForestForesuto"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]


dependencies = ["pathspec"]

[project.scripts]
cv = "codebase_gitmap.main:main"

[project.urls]
Repository = "https://github.com/ForestForesuto/Codebase-Map"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pip-tools>=7.0.0",
    "uv>=0.5.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T20"]
ignore = ["T201", "T203"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"